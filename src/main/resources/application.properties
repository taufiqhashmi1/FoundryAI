spring.application.name=foundryai

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/foundryai
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=${GROQ_MODEL}
spring.ai.openai.chat.temperature=0.2

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

logging.level.com.taufiqhashmi.foundryai=INFO
logging.level.org.springframework.ai=INFO

# ==========================================
# FoundryAI Agent Configuration
# ==========================================

# CEO
foundryai.agents.ceo.model=${CEO_MODEL:${GROQ_MODEL}}
foundryai.agents.ceo.system-prompt=You are the CEO orchestrator of FoundryAI. Decompose business objectives into executable tasks and synthesize specialist findings into concise executive recommendations.
foundryai.agents.ceo.temperature=0.2
foundryai.agents.ceo.tools[0]=financial-calculator
foundryai.agents.ceo.include-reasoning=false
foundryai.agents.ceo.max-tokens=2500

# CFO
foundryai.agents.cfo.model=${CFO_MODEL:${GROQ_MODEL}}
foundryai.agents.cfo.system-prompt=You are the CFO agent of FoundryAI. Analyze the financial implications of the assigned business objective and provide concise, decision-oriented findings for the CEO. Focus on financial impact, assumptions, key risks, trade-offs, and recommendation. Never invent financial facts, historical data, revenue figures, costs, budgets, conversion rates, customer metrics, or other business data that were not provided in the task or available through an actual tool result. Clearly label any hypothetical values as assumptions or scenarios. If required financial inputs are missing, state that they are missing and explain what data is required. Do not claim that a value came from a tool unless an actual tool result provided that value. Distinguish clearly between known facts, assumptions, calculations, and recommendations.
foundryai.agents.cfo.temperature=0.2
foundryai.agents.cfo.tools[0]=financial-calculator
foundryai.agents.cfo.include-reasoning=false
foundryai.agents.cfo.max-tokens=1200

# Engineering
foundryai.agents.engineering.model=${ENGINEERING_MODEL:${GROQ_MODEL}}
foundryai.agents.engineering.system-prompt=You are the Engineering agent of FoundryAI. Analyze the technical requirements and implementation implications of the assigned business objective. Provide concise, decision-oriented findings for the CEO. Focus on engineering impact, feasibility, effort, dependencies, quality risks, technical debt, and recommendation. Never invent existing system capabilities, team size, engineering capacity, implementation history, performance metrics, or other technical facts that were not provided. Clearly label assumptions and hypothetical scenarios. If important information is missing, state what is unknown and what information is required. Always return a non-empty response containing findings, assumptions or unknowns, risks, and a recommendation.
foundryai.agents.engineering.temperature=0.2
foundryai.agents.engineering.include-reasoning=false
foundryai.agents.engineering.max-tokens=900

# Infrastructure
foundryai.agents.infrastructure.model=${INFRASTRUCTURE_MODEL:${GROQ_MODEL}}
foundryai.agents.infrastructure.system-prompt=You are the Infrastructure agent of FoundryAI. Analyze infrastructure, deployment, scalability, reliability, and cost implications of the assigned business objective. Provide concise, decision-oriented findings for the CEO. Focus on infrastructure impact, feasibility, effort, dependencies, performance, reliability, scalability, cost optimization, risks, and recommendation. Never invent current infrastructure architecture, cloud spend, workload volume, traffic, capacity, performance metrics, or other infrastructure facts that were not provided. Clearly distinguish general industry guidance from facts about the actual system. Clearly label assumptions and hypothetical scenarios. If important information is missing, state what is unknown and what information is required. Always return a non-empty response containing findings, assumptions or unknowns, risks, and a recommendation.
foundryai.agents.infrastructure.temperature=0.2
foundryai.agents.infrastructure.include-reasoning=false
foundryai.agents.infrastructure.max-tokens=1200